<!--
  AI Interviewer - practice platform front-end.

  Single page, no framework. Three sections (login, app shell, boot error).
  Every element the JS touches has an id, and every view is a <section class="view">
  that is shown by removing the hidden attribute. See style.css for tokens.
-->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Interviewer</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ============================ LOGIN ============================ -->
<section id="login-view" class="login-screen">
  <form id="login-form" class="login-card" autocomplete="off">
    <h1 class="login-title">Welcome back</h1>
    <p class="login-sub" id="login-sub">Sign in to continue practising.</p>

    <label class="field">
      <span>Email</span>
      <input type="email" name="email" required autocomplete="username">
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" name="password" required autocomplete="current-password">
    </label>

    <div id="register-fields" hidden>
      <label class="field">
        <span>Display name</span>
        <input type="text" name="name" autocomplete="name">
      </label>
      <label class="field">
        <span>College</span>
        <input type="text" name="college">
      </label>
      <label class="field">
        <span>Branch</span>
        <input type="text" name="branch">
      </label>
    </div>

    <p class="login-error" id="login-error" hidden></p>

    <button type="submit" class="btn btn-primary btn-block" id="login-submit">Sign in</button>
    <button type="button" class="btn btn-quiet btn-block" id="login-toggle">Need an account? Register</button>
  </form>
</section>

<!-- ========================= APP SHELL ========================== -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">&lt;/&gt;</span>
      <span class="brand">AI Interviewer</span>
    </div>
    <button class="cmdk-trigger" id="cmdk-trigger" type="button">
      <span>Search or jump to…</span><kbd>Ctrl K</kbd>
    </button>
    <div class="topbar-right">
      <button class="icon-btn" id="theme-toggle" type="button" title="Toggle theme">&#9789;</button>
      <span class="who" id="who"></span>
      <button class="btn btn-quiet" id="sign-out" type="button">Sign out</button>
    </div>
  </header>

  <div class="shell">
    <nav class="nav" id="nav"></nav>
    <main class="main">
      <div class="view-head" id="view-head"></div>

      <section id="view-problems" class="view"></section>
      <section id="view-problem" class="view" hidden></section>
      <section id="view-dashboard" class="view" hidden></section>
      <section id="view-skills" class="view" hidden></section>
      <section id="view-profile" class="view" hidden></section>
      <section id="view-submissions" class="view" hidden></section>
      <section id="view-board" class="view" hidden></section>
      <section id="view-admin" class="view" hidden></section>
      <section id="view-interview" class="view" hidden></section>
      <section id="view-report" class="view" hidden></section>
      <section id="view-daily" class="view" hidden></section>
      <section id="view-start" class="view" hidden></section>
    </main>
  </div>
</div>

<!-- ======================= COMMAND PALETTE ====================== -->
<div id="cmdk" class="cmdk-backdrop" hidden>
  <div class="cmdk" role="dialog" aria-label="Command palette">
    <input id="cmdk-input" type="text" placeholder="Search problems, jump to a page…" autocomplete="off" spellcheck="false">
    <div class="cmdk-list" id="cmdk-list"></div>
    <div class="cmdk-foot">
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span>
      <span><kbd>&crarr;</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<!-- ========================= BOOT ERROR ======================== -->
<section id="boot-error" class="boot-error" hidden>
  <div class="boot-error-card">
    <h2>The interface failed to start</h2>
    <p>The page shell loaded, but its script did not finish. The message below
       is the actual browser error.</p>
    <pre id="boot-error-detail" class="problem-text"></pre>
  </div>
</section>

<script src="/app.js"></script>
</body>
</html>
